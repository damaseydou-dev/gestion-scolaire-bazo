{% extends 'base.html' %}
{% load static %}
{% block title %}Connexion - Gestion Scolaire{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <img src="{% static 'images/logo_bazo.jpeg' %}" alt="Logo Université BAZO" style="height: 90px;" class="mb-3">
                <h3>Université BAZO</h3>
                <p class="text-muted">Plateforme de Gestion Scolaire</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
